name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Type Check + Lint + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: nexusmind
          POSTGRES_USER: nexusmind
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'nexusmind123' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Initialize database
        run: PGPASSWORD=${{ secrets.CI_DB_PASSWORD || 'nexusmind123' }} psql -h localhost -U nexusmind -d nexusmind -f sql/schema.sql
        env:
          DATABASE_URL: postgresql://nexusmind:${{ secrets.CI_DB_PASSWORD || 'nexusmind123' }}@localhost:5432/nexusmind
          DATABASE_HOST: localhost

      - name: Type check packages
        run: |
          npx tsc --noEmit --skipLibCheck --project packages/types/tsconfig.json
          npx tsc --noEmit --skipLibCheck --project packages/charter/tsconfig.json
          npx tsc --noEmit --skipLibCheck --project packages/sentinel/tsconfig.json
          npx tsc --noEmit --skipLibCheck --project packages/core/tsconfig.json
          npx tsc --noEmit --skipLibCheck --project packages/assistant/tsconfig.json
          npx tsc --noEmit --skipLibCheck --project packages/tui/tsconfig.json
          npx tsc --noEmit --skipLibCheck --project packages/nexusmind/tsconfig.json

      - name: Prettier check
        run: npx prettier --check . --ignore-path .prettierignore

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
