<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColoMind</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460; --text: #e0e0e0; --text2: #a0a0a0; --accent: #4e9af1; --accent2: #3a7bd5; --danger: #e74c3c; --success: #2ecc71; --warn: #f39c12; --border: #2a2a4a; --code-bg: #2d2d4a; --purple: #9b59b6; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

/* Sidebar */
.sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.sidebar-header h2 { font-size: 16px; font-weight: 600; }
.sidebar-header .greeting { font-size: 11px; color: var(--text2); margin-top: 2px; }
.sidebar-header .status { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; margin-top: 4px; }
.sidebar-header .status .dot { width: 6px; height: 6px; border-radius: 50%; }
.sidebar-header .status.ok .dot { background: var(--success); }
.sidebar-header .status.err .dot { background: var(--danger); }

.nav-group { padding: 8px 0; }
.nav-group-label { font-size: 10px; font-weight: 600; color: var(--text2); padding: 4px 16px; text-transform: uppercase; letter-spacing: 0.5px; }
.nav-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 16px; border: none; background: none; color: var(--text2); font-size: 13px; cursor: pointer; text-align: left; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bg3); color: var(--accent); border-left: 3px solid var(--accent); }
.nav-item .icon { font-size: 14px; width: 20px; text-align: center; }

/* Session list (in chat view) */
.sessions { flex: 1; overflow-y: auto; padding: 4px 8px; }
.session-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; color: var(--text2); }
.session-item:hover { background: var(--bg3); color: var(--text); }
.session-item.active { background: var(--bg3); color: var(--text); border-left: 3px solid var(--accent); }
.session-item .del { color: var(--danger); cursor: pointer; opacity: 0; font-size: 11px; }
.session-item:hover .del { opacity: 1; }

/* Main content */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.topbar h1 { font-size: 15px; flex: 1; }
.topbar .badge { font-size: 11px; color: var(--text2); background: var(--bg2); padding: 3px 8px; border-radius: 4px; }
.topbar button { background: none; border: 1px solid var(--border); color: var(--text2); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.topbar button:hover { border-color: var(--accent); color: var(--accent); }

/* Page container */
.page { flex: 1; overflow-y: auto; padding: 20px; display: none; }
.page.active { display: block; }

/* Chat */
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.msg { margin-bottom: 16px; max-width: 80%; }
.msg.user { margin-left: auto; }
.msg .role { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.msg .content { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user .content { background: var(--bg3); border-bottom-right-radius: 2px; }
.msg.assistant .content { background: var(--bg2); border-bottom-left-radius: 2px; }
.msg.assistant .content code { background: var(--code-bg); padding: 2px 5px; border-radius: 3px; font-size: 13px; }
.msg.assistant .content pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
.msg.assistant .content pre code { background: none; padding: 0; }
.msg .thinking { background: rgba(78,154,241,0.08); border: 1px solid rgba(78,154,241,0.2); border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; font-size: 12px; color: var(--text2); line-height: 1.5; cursor: pointer; }
.msg .thinking::before { content: '💭 思考中...'; display: block; color: var(--accent); font-size: 11px; margin-bottom: 4px; font-weight: 600; }
.msg .thinking.done::before { content: '💭 思考过程'; }
.msg .thinking.collapsed { max-height: 24px; overflow: hidden; }
.msg .thinking.collapsed::before { content: '💭 思考过程 (点击展开)'; }
.input-area { padding: 12px 20px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.input-row { display: flex; gap: 10px; }
.input-row textarea { flex: 1; background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 14px; resize: none; outline: none; font-family: inherit; min-height: 44px; max-height: 150px; }
.input-row textarea:focus { border-color: var(--accent); }
.input-row button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; font-size: 14px; }
.input-row button:hover { background: var(--accent2); }
.input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Tool call */
.tool-call { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin: 6px 0; font-size: 12px; color: var(--text2); cursor: pointer; }
.tool-call .tool-name { color: var(--accent); font-weight: 600; }
.tool-call .tool-result { margin-top: 6px; color: var(--text); font-size: 13px; display: none; }
.tool-call.expanded .tool-result { display: block; }

/* Cards */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

/* Tags */
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 4px; margin-bottom: 4px; }
.tag-accent { background: rgba(78,154,241,0.15); color: var(--accent); }
.tag-success { background: rgba(46,204,113,0.15); color: var(--success); }
.tag-danger { background: rgba(231,76,60,0.15); color: var(--danger); }
.tag-warn { background: rgba(243,156,18,0.15); color: var(--warn); }
.tag-purple { background: rgba(155,89,182,0.15); color: var(--purple); }

/* Sentinel */
.sentinel-layers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.sentinel-layer { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
.sentinel-layer h4 { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.sentinel-layer .status-icon { font-size: 24px; margin-bottom: 4px; }
.sentinel-layer .status-text { font-size: 13px; font-weight: 600; }
.sentinel-scan { display: flex; gap: 8px; margin-bottom: 16px; }
.sentinel-scan input { flex: 1; background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
.sentinel-scan input:focus { border-color: var(--accent); }
.sentinel-scan button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 13px; }
.sentinel-result { padding: 14px; border-radius: 10px; margin-bottom: 16px; }
.sentinel-result.safe { background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.3); }
.sentinel-result.blocked { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; width: 560px; max-height: 80vh; overflow-y: auto; }
.modal h2 { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 16px; }
.modal-body { padding: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; font-family: inherit; }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group .hint { font-size: 11px; color: var(--text2); margin-top: 4px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.form-actions button { padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; border: none; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.section-title { font-size: 13px; font-weight: 600; color: var(--accent); margin: 20px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

/* Config prompt */
.config-prompt { text-align: center; padding-top: 30vh; }
.config-prompt p { color: var(--text2); font-size: 14px; margin-bottom: 16px; }
.config-prompt button { background: var(--accent); color: #fff; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; }

/* Log panel */
.log-entry { padding: 6px 8px; border-bottom: 1px solid var(--border); line-height: 1.5; }
.log-entry:hover { background: var(--bg3); }
.log-entry .log-time { color: var(--text2); font-size: 11px; }
.log-entry .log-level { font-weight: 600; font-size: 11px; padding: 1px 4px; border-radius: 3px; }
.log-entry .log-level.error { color: var(--danger); background: rgba(231,76,60,0.15); }
.log-entry .log-level.warn { color: var(--warn); background: rgba(243,156,18,0.15); }
.log-entry .log-level.info { color: var(--accent); background: rgba(78,154,241,0.15); }
.log-entry .log-level.debug { color: var(--text2); background: rgba(160,160,160,0.1); }
.log-entry .log-cat { color: var(--text2); font-size: 11px; }
.log-entry .log-msg { color: var(--text); margin-top: 2px; }
.log-entry .log-detail { color: var(--text2); font-size: 11px; margin-top: 2px; word-break: break-all; }
.log-entry .log-dur { color: var(--purple); font-size: 11px; }

/* Tabs */
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--bg2); border-radius: 8px; margin-bottom: 16px; }
.tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; border-radius: 6px; cursor: pointer; border: none; background: none; color: var(--text2); font-weight: 500; }
.tab.active { background: var(--accent); color: #fff; }
.tab:hover:not(.active) { background: var(--bg3); }

/* Table */
.table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 14px; background: var(--bg2); color: var(--text2); font-weight: 500; font-size: 12px; }
td { padding: 8px 14px; border-top: 1px solid var(--border); }
tr:hover td { background: var(--bg2); }

/* Empty state */
.empty { text-align: center; padding: 48px 20px; color: var(--text2); }
.empty .icon { font-size: 32px; margin-bottom: 8px; }

/* Light theme */
[data-theme="light"] { --bg: #f5f5f5; --bg2: #ffffff; --bg3: #e8e8e8; --text: #1a1a1a; --text2: #666666; --accent: #2563eb; --accent2: #1d4ed8; --border: #d4d4d4; --code-bg: #f0f0f0; --danger: #dc2626; --success: #16a34a; --warn: #d97706; --purple: #7c3aed; }
[data-theme="light"] .msg.user .content { background: #e0e7ff; }
[data-theme="light"] .msg.assistant .content { background: #f9fafb; }
[data-theme="light"] .tool-call { background: #f0f0f0; }
[data-theme="light"] .msg .thinking { background: rgba(37,99,235,0.06); border-color: rgba(37,99,235,0.2); }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <h2>ColoMind</h2>
    <div class="greeting" id="userGreeting"></div>
    <div class="status" id="connStatus"><span class="dot"></span> <span>Connecting...</span></div>
  </div>

  <div class="nav-group">
    <div class="nav-group-label">智能</div>
    <button class="nav-item active" data-page="chat" onclick="switchPage('chat')"><span class="icon">💬</span> 对话</button>
    <button class="nav-item" data-page="agents" onclick="switchPage('agents')"><span class="icon">🤖</span> Agent</button>
  </div>
  <div class="nav-group">
    <div class="nav-group-label">安全</div>
    <button class="nav-item" data-page="sentinel" onclick="switchPage('sentinel')"><span class="icon">🛡️</span> Sentinel</button>
  </div>
  <div class="nav-group">
    <div class="nav-group-label">系统</div>
    <button class="nav-item" data-page="logs" onclick="switchPage('logs')"><span class="icon">📋</span> 日志</button>
    <button class="nav-item" data-page="charter" onclick="switchPage('charter')"><span class="icon">📜</span> 许可证</button>
    <button class="nav-item" data-page="skills" onclick="switchPage('skills')"><span class="icon">⚡</span> 技能</button>
  </div>

  <div style="flex:1"></div>

  <!-- Session list (shown in chat mode) -->
  <div id="sessionSection" style="border-top:1px solid var(--border);max-height:200px;overflow-y:auto;padding:8px">
    <div style="font-size:10px;color:var(--text2);padding:4px 8px;font-weight:600">对话历史</div>
    <div id="sessionList" style="font-size:12px"></div>
  </div>

  <div class="nav-group" style="border-top:1px solid var(--border);padding-top:8px">
    <button class="nav-item" data-page="settings" onclick="switchPage('settings')"><span class="icon">⚙️</span> 设置</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Chat Page -->
  <div id="page-chat" class="page active" style="display:flex;flex-direction:column;padding:0">
    <div class="topbar">
      <h1 id="chatTitle">ColoMind</h1>
      <span class="badge" id="modelBadge"></span>
      <button onclick="newSession()">+ 新对话</button>
    </div>
    <div class="messages" id="msgArea"></div>
    <div class="input-area">
      <div id="filePreviewArea" style="display:none;margin-bottom:6px"></div>
      <div class="input-row">
        <input type="file" id="fileInput" multiple accept=".txt,.md,.csv,.json,.log,.py,.js,.ts,.tsx,.jsx,.html,.css,.xml,.yaml,.yml,.toml,.ini,.conf,.sh,.bash,.zsh,.sql,.rs,.go,.java,.c,.cpp,.h,.hpp,.rb,.php,.swift,.kt,.gradle,.properties,.env,.gitignore,.dockerfile,.pdf,.png,.jpg,.jpeg,.gif,.webp,.svg" style="display:none">
        <button onclick="document.getElementById('fileInput').click()" style="background:none;border:1px solid var(--border);color:var(--text2);padding:0 10px;border-radius:8px;cursor:pointer;font-size:16px" title="上传文件">📎</button>
        <textarea id="msgInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <!-- Agents Page -->
  <div id="page-agents" class="page">
    <h1 style="font-size:18px;font-weight:600;margin-bottom:16px">🤖 Agent 管理</h1>
    <div id="agentList"></div>
  </div>

  <!-- Sentinel Page -->
  <div id="page-sentinel" class="page">
    <h1 style="font-size:18px;font-weight:600;margin-bottom:16px">🛡️ Sentinel 安全系统</h1>
    <div id="sentinelContent"></div>
  </div>

  <!-- Logs Page -->
  <div id="page-logs" class="page">
    <h1 style="font-size:18px;font-weight:600;margin-bottom:16px">📋 系统日志</h1>
    <div id="logsContent"></div>
  </div>

  <!-- Charter Page -->
  <div id="page-charter" class="page">
    <h1 style="font-size:18px;font-weight:600;margin-bottom:16px">📜 Charter 许可证</h1>
    <div id="charterContent"></div>
  </div>

  <!-- Skills Page -->
  <div id="page-skills" class="page">
    <h1 style="font-size:18px;font-weight:600;margin-bottom:16px">⚡ 技能</h1>
    <div id="skillsContent"></div>
  </div>

  <!-- Settings Page -->
  <div id="page-settings" class="page">
    <h1 style="font-size:18px;font-weight:600;margin-bottom:16px">⚙️ 设置</h1>
    <div id="settingsContent"></div>
  </div>
</div>

<div id="modalContainer" style="display:none"></div>

<script>
const API = '';
let currentPage = 'chat';
let currentSessionId = null;
let sessions = [];
let settings = {};
let isStreaming = false;

// ─── Init ────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch(API + '/api/health');
    if (!r.ok) throw new Error();
    document.getElementById('connStatus').className = 'status ok';
    document.getElementById('connStatus').querySelector('span:last-child').textContent = 'Connected';
  } catch {
    document.getElementById('connStatus').className = 'status err';
    document.getElementById('connStatus').querySelector('span:last-child').textContent = 'Disconnected';
  }
  settings = await (await fetch(API + '/api/settings')).json().catch(() => ({}));
  updateModelBadge();
  updateUserGreeting();
  applyTheme();
  checkConfig();
  await loadSessions();
}

function updateModelBadge() {
  const m = settings.anthropicDefaultModel || settings.openaiDefaultModel || settings.defaultModel || '';
  document.getElementById('modelBadge').textContent = m || '未配置';
}
function updateUserGreeting() {
  const name = settings.username || '';
  document.getElementById('userGreeting').textContent = name ? `你好, ${name}` : '';
}

function checkConfig() {
  const hasKey = settings.anthropicApiKey || settings.openaiApiKey;
  const hasModel = settings.anthropicDefaultModel || settings.openaiDefaultModel || settings.defaultModel;
  if (!hasKey || !hasModel) {
    document.getElementById('msgArea').innerHTML =
      '<div class="config-prompt"><p>请先配置 API Key 和模型</p><button onclick="switchPage(\'settings\')">打开设置</button></div>';
    return false;
  }
  return true;
}

// ─── Navigation ──────────────────────────────────────
function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById('page-' + page);
  if (el) el.classList.add('active');

  if (page === 'agents') loadAgents();
  else if (page === 'sentinel') loadSentinel();
  else if (page === 'logs') loadLogsPage();
  else if (page === 'charter') loadCharter();
  else if (page === 'skills') loadSkills();
  else if (page === 'settings') loadSettingsPage();
}

// ─── Sessions ────────────────────────────────────────
async function loadSessions() {
  sessions = await (await fetch(API + '/api/sessions')).json().catch(() => []);
  renderSessions();
}

function renderSessions() {
  const el = document.getElementById('sessionList');
  if (!el) return;
  el.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" onclick="selectSession('${s.id}')">
      <span>${escapeHtml(s.title || s.id)}</span>
      <span class="del" onclick="event.stopPropagation();deleteSession('${s.id}')">✕</span>
    </div>
  `).join('');
}

async function newSession() {
  const id = 's-' + Date.now();
  await fetch(API + '/api/sessions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, title: '新对话' })
  });
  currentSessionId = id;
  document.getElementById('msgArea').innerHTML = '';
  document.getElementById('chatTitle').textContent = '新对话';
  await loadSessions();
}

async function selectSession(id) {
  currentSessionId = id;
  const s = sessions.find(x => x.id === id);
  document.getElementById('chatTitle').textContent = s?.title || id;
  renderSessions();
  const msgs = await (await fetch(API + '/api/sessions/' + id + '/messages')).json().catch(() => []);
  const area = document.getElementById('msgArea');
  area.innerHTML = '';
  for (const m of msgs) appendMessage(m.role, m.content);
}

async function deleteSession(id) {
  await fetch(API + '/api/sessions/' + id, { method: 'DELETE' });
  if (currentSessionId === id) {
    currentSessionId = null;
    document.getElementById('msgArea').innerHTML = '';
    document.getElementById('chatTitle').textContent = 'ColoMind';
  }
  await loadSessions();
}

// ─── Chat ────────────────────────────────────────────
function appendMessage(role, content) {
  const area = document.getElementById('msgArea');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  let html = renderMarkdown(content);
  div.innerHTML = `<div class="role">${role === 'user' ? '你' : 'ColoMind'}</div><div class="content">${html}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function renderMarkdown(text) {
  let s = escapeHtml(text);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  s = s.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  s = s.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--accent)">$1</a>');
  return s;
}

function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ─── File Upload ─────────────────────────────────────
let pendingFiles = [];

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  for (const f of files) {
    if (pendingFiles.length >= 10) { alert('最多同时上传 10 个文件'); break; }
    pendingFiles.push(f);
  }
  e.target.value = '';
  renderFilePreview();
});

function renderFilePreview() {
  const area = document.getElementById('filePreviewArea');
  if (!pendingFiles.length) { area.style.display = 'none'; area.innerHTML = ''; return; }
  area.style.display = '';
  area.innerHTML = pendingFiles.map((f, i) => `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;font-size:12px;margin-right:4px">${escapeHtml(f.name)} <button onclick="removePendingFile(${i})" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px">✕</button></span>`).join('');
}

function removePendingFile(i) {
  pendingFiles.splice(i, 1);
  renderFilePreview();
}

async function readFileAsText(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve('');
    reader.readAsText(file);
  });
}

async function readFileAsDataURL(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

async function buildFileContext() {
  if (!pendingFiles.length) return '';
  const SMALL_LIMIT = 30000;
  // Upload large files to server first so AI can use read_file_chunks
  const largeFiles = pendingFiles.filter(f => f.size > SMALL_LIMIT && !['png','jpg','jpeg','gif','webp','svg'].includes(f.name.split('.').pop().toLowerCase()));
  if (largeFiles.length) {
    const fd = new FormData();
    for (const f of largeFiles) fd.append('files', f);
    const uploadRes = await (await fetch(API + '/api/upload', { method: 'POST', body: fd })).json().catch(() => ({ files: [] }));
    for (const f of largeFiles) {
      const serverFile = uploadRes.files?.find(uf => uf.name === f.name);
      if (serverFile) {
        f._serverPath = serverFile.path;
      }
    }
  }
  let ctx = '\n\n--- 用户上传的文件 ---\n';
  for (const f of pendingFiles) {
    const ext = f.name.split('.').pop().toLowerCase();
    const isImage = ['png','jpg','jpeg','gif','webp','svg'].includes(ext);
    if (isImage) {
      const b64 = await readFileAsDataURL(f);
      ctx += `[文件: ${f.name} (图片)]\n![${f.name}](${b64})\n\n`;
    } else if (f._serverPath) {
      // 大文件已上传到服务器，告诉 AI 用工具读取
      ctx += `[文件: ${f.name} (${(f.size/1024).toFixed(0)}KB) — 已上传至 ${f._serverPath}，请使用 read_file_chunks 工具逐块读取]\n\n`;
    } else {
      const text = await readFileAsText(f);
      ctx += `[文件: ${f.name}]\n\`\`\`${ext}\n${text}\n\`\`\`\n\n`;
    }
  }
  return ctx;
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if ((!text && !pendingFiles.length) || isStreaming) return;
  if (!checkConfig()) return;
  if (!currentSessionId) await newSession();

  input.value = '';
  input.style.height = 'auto';

  const fileCtx = await buildFileContext();
  const userContent = text + fileCtx;
  const displayText = pendingFiles.length ? text + ' [' + pendingFiles.map(f => f.name).join(', ') + ']' : text;
  pendingFiles = [];
  renderFilePreview();

  appendMessage('user', displayText);

  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;

  const msgDiv = appendMessage('assistant', '');
  const contentEl = msgDiv.querySelector('.content');
  let fullText = '';
  let thinkingEl = null;
  let thinkingText = '';

  try {
    const res = await fetch(API + '/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: currentSessionId, messages: [{ role: 'user', content: userContent }] })
    });

    if (!res.ok) {
      contentEl.textContent = 'Error: ' + await res.text();
      isStreaming = false;
      document.getElementById('sendBtn').disabled = false;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let sseBuffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      sseBuffer += chunk;
      const lines = sseBuffer.split('\n');
      sseBuffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.error) { contentEl.textContent = parsed.error; continue; }

          // Thinking
          if (parsed.type === 'thinking' && parsed.thinking) {
            if (!thinkingEl) {
              thinkingEl = document.createElement('div');
              thinkingEl.className = 'thinking';
              thinkingEl.onclick = () => thinkingEl.classList.toggle('collapsed');
              msgDiv.insertBefore(thinkingEl, contentEl);
            }
            thinkingText += parsed.thinking;
            thinkingEl.textContent = thinkingText;
            document.getElementById('msgArea').scrollTop = document.getElementById('msgArea').scrollHeight;
            continue;
          }

          // Tool call
          if (parsed.type === 'tool_call') {
            const tc = document.createElement('div');
            tc.className = 'tool-call';
            tc.innerHTML = `<span class="tool-name">🔧 ${escapeHtml(parsed.tool_name || parsed.name || 'tool')}</span><div class="tool-result">${escapeHtml(parsed.result || JSON.stringify(parsed, null, 2))}</div>`;
            tc.onclick = () => tc.classList.toggle('expanded');
            msgDiv.insertBefore(tc, contentEl);
            continue;
          }

          const delta = parsed.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;
            contentEl.innerHTML = renderMarkdown(fullText);
            document.getElementById('msgArea').scrollTop = document.getElementById('msgArea').scrollHeight;
          }
        } catch {}
      }
    }
  } catch (e) {
    contentEl.textContent = 'Connection error: ' + e.message;
  }

  if (thinkingEl) { thinkingEl.classList.add('done'); thinkingEl.classList.add('collapsed'); }
  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}

async function saveSettingsPage() {
  const provider = document.getElementById('s_provider')?.value || 'anthropic';
  const apiKey = document.getElementById('s_apikey')?.value || '';
  const endpoint = document.getElementById('s_endpoint')?.value || '';
  const model = document.getElementById('s_model')?.value || '';
  const searchEngine = document.getElementById('s_searchengine')?.value || 'none';
  const searxngUrl = document.getElementById('s_searxng_url')?.value || '';
  const theme = document.getElementById('s_theme')?.value || 'dark';
  const language = document.getElementById('s_language')?.value || 'zh-CN';
  const username = document.getElementById('s_username')?.value || '';
  const userRole = document.getElementById('s_userRole')?.value || '';

  const body = { llmProvider: provider, searchEngine, searxngUrl, defaultModel: model, theme, language, username, userRole };
  if (provider === 'anthropic') {
    if (apiKey) body.anthropicApiKey = apiKey;
    body.anthropicApiEndpoint = endpoint;
    body.anthropicDefaultModel = model;
  } else {
    if (apiKey) body.openaiApiKey = apiKey;
    body.openaiApiEndpoint = endpoint;
    body.openaiDefaultModel = model;
  }

  await fetch(API + '/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  // Save workspace JSON files
  const agentId = settings.defaultAgentId || 'default-desktop-agent';
  const identity = { name: document.getElementById('ws_identity_name')?.value || '', role: document.getElementById('ws_identity_role')?.value || '', description: document.getElementById('ws_identity_desc')?.value || '' };
  const soul = {
    personality: document.getElementById('ws_soul_personality')?.value || '',
    tone: document.getElementById('ws_soul_tone')?.value || '',
    rules: Array.from(document.querySelectorAll('.ws-rule')).map(el => el.value).filter(Boolean),
    boundaries: Array.from(document.querySelectorAll('.ws-boundary')).map(el => el.value).filter(Boolean),
  };
  const user = { name: document.getElementById('ws_user_name')?.value || '', role: document.getElementById('ws_user_role')?.value || '', preferences: document.getElementById('ws_user_prefs')?.value || '', notes: document.getElementById('ws_user_notes')?.value || '' };
  const toolsData = { skills: Array.from(document.querySelectorAll('.ws-skill-cb:checked')).map(el => el.value), guidelines: Array.from(document.querySelectorAll('.ws-guideline')).map(el => el.value).filter(Boolean) };
  await fetch(API + '/api/agents/' + agentId + '/workspace/identity.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: identity }) });
  await fetch(API + '/api/agents/' + agentId + '/workspace/soul.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: soul }) });
  await fetch(API + '/api/agents/' + agentId + '/workspace/user.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: user }) });
  await fetch(API + '/api/agents/' + agentId + '/workspace/tools.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: toolsData }) });

  settings = await (await fetch(API + '/api/settings')).json().catch(() => body);
  updateModelBadge();
  updateUserGreeting();
  applyTheme();

  const saved = document.getElementById('settingsSaved');
  if (saved) { saved.style.display = ''; setTimeout(() => saved.style.display = 'none', 2000); }
}

function applyTheme() {
  const theme = settings.theme || 'dark';
  if (theme === 'auto') {
    document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
}

// ─── Start ───────────────────────────────────────────
init();
</script>
</body>
