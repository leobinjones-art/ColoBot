# NexusMind Docker Compose
# Complete stack with PostgreSQL and Redis

services:
  nexusmind:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexusmind/nexusmind:${VERSION:-latest}
    container_name: nexusmind
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # LLM Providers
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_GROUP_ID=${MINIMAX_GROUP_ID:-}
      # Database
      - DATABASE_URL=postgresql://nexusmind:${DB_PASSWORD:-nexusmind}@postgres:5432/nexusmind
      # Redis (for Sentinel distributed mode)
      - REDIS_URL=redis://redis:6379
      # Config
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nexusmind-network
    volumes:
      - nexusmind-data:/app/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusmind-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nexusmind
      - POSTGRES_PASSWORD=${DB_PASSWORD:-nexusmind}
      - POSTGRES_DB=nexusmind
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexusmind']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusmind-network

  redis:
    image: redis:7-alpine
    container_name: nexusmind-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusmind-network

networks:
  nexusmind-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nexusmind-data:
